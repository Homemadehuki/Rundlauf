name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Web-Dateien vorbereiten
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png www/
      - name: Abhaengigkeiten installieren
        run: npm install --legacy-peer-deps
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          python3 patch_android.py
          python3 patch_wear.py
      - name: Web-Dateien synchronisieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Uhren-APK bauen
        id: wear
        continue-on-error: true
        working-directory: android
        run: ./gradlew :wear:assembleDebug --no-daemon
      - name: APK veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rundlauf.apk
          FILES="Rundlauf.apk"
          if [ -f android/wear/build/outputs/apk/debug/wear-debug.apk ]; then cp android/wear/build/outputs/apk/debug/wear-debug.apk RundlaufUhr.apk; FILES="$FILES RundlaufUhr.apk"; fi
          gh release create "build-${{ github.run_number }}" $FILES --title "Rundlauf Build ${{ github.run_number }}" --notes "Debug-APK zum Installieren auf Android."
