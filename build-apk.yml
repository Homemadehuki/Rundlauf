name: APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Abhaengigkeiten installieren
        run: npm install --legacy-peer-deps
      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          python3 scripts/patch_android.py
      - name: App-Icon erzeugen (optional)
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor "#1f5a41" --iconBackgroundColorDark "#1f5a41"
      - name: Web-Dateien synchronisieren
        run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Release mit APK veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Rundlauf.apk
          gh release create "build-${{ github.run_number }}" Rundlauf.apk --title "Rundlauf Build ${{ github.run_number }}" --notes "Debug-APK zum Installieren auf Android."
      - uses: actions/upload-artifact@v4
        with:
          name: Rundlauf-APK
          path: Rundlauf.apk
